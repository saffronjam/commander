name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        working-directory: dashboard

      - name: Check Go formatting
        run: |
          gofmt -s -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
        working-directory: api

      - name: Check frontend formatting
        run: bunx oxfmt --check src
        working-directory: dashboard

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        working-directory: dashboard

      - name: Go vet
        run: go vet ./...
        working-directory: api

      - name: Oxlint
        run: bunx oxlint src
        working-directory: dashboard

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        working-directory: dashboard

      - name: Go build
        run: go build ./...
        working-directory: api

      - name: TypeScript
        run: bunx tsc --noEmit
        working-directory: dashboard

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Go tests
        run: go test ./... -race -count=1
        working-directory: api

  codegen:
    name: Codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: oven-sh/setup-bun@v2

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.0"

      - uses: extractions/setup-just@v4

      - run: bun install --frozen-lockfile
        working-directory: dashboard

      # Re-runs sqlc, gqlgen, graphql-codegen and tygo, then fails if any
      # committed output moved.
      - name: Verify generated code is up to date
        run: just check-generated

  build-and-push:
    name: Build & Push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [format, lint, typecheck, test, codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag builds stamp the tag; main builds stamp "latest". The value ends up
      # in the sidebar and on /version, and .dockerignore excludes .git, so it
      # has to travel in as a build arg.
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract app metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/satisfactory-dashboard
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract seeder metadata
        id: meta-seed
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/satisfactory-dashboard-seed
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push seeder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.seed
          push: true
          tags: ${{ steps.meta-seed.outputs.tags }}
          labels: ${{ steps.meta-seed.outputs.labels }}
