name: Build and Push Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_assets:
        description: 'Publish the map/icon tiles OCI artifact via ORAS (requires LFS)'
        type: boolean
        default: false
      assets_tag:
        description: 'Tag for the assets artifact (e.g. tiles-YYYYMMDD)'
        type: string
        default: latest

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/satisfactory-dashboard
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate build version
        id: version
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H:%M')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=release-${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BUILD_VERSION=${{ steps.version.outputs.version }}

  build-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/satisfactory-dashboard-seed
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push seeder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.seed
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-assets:
    # Manual, rare: only when tiles change. The ONLY job that touches LFS.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Push assets artifact
        # Push from inside assets/ so the layer titles are bare basenames
        # (map-realistic.tar.gz, …). The seeder does `oras pull -o "$tmp"` and
        # reads "$tmp/<basename>"; a path-qualified title would restore under
        # "$tmp/assets/…" and the seeder would not find the tarballs.
        working-directory: assets
        run: |
          oras push ${{ env.REGISTRY }}/${{ github.repository_owner }}/satisfactory-dashboard-assets:${{ inputs.assets_tag }} \
            --artifact-type application/vnd.satisfactory-dashboard.assets \
            map-realistic.tar.gz:application/gzip \
            map-game.tar.gz:application/gzip \
            scraped-images.tar.gz:application/gzip
