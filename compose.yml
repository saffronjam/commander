services:

  # One-shot seeder: pulls the versioned map/icon tiles OCI artifact into the
  # shared assets volume via ORAS, then exits. Idempotent (a version marker
  # makes a restart a no-op). The app waits for it to complete successfully.
  seed-assets:
    image: ghcr.io/saffronjam/satisfactory-dashboard-seed:${SD_VERSION:-latest}
    environment:
      # Pinned to a published tiles revision. There is no ":latest" for this
      # artifact: the seeder skips work while the ref matches the marker it
      # wrote, so a moving tag would never trigger a re-pull.
      - SD_ASSETS_REF=${SD_ASSETS_REF:-ghcr.io/saffronjam/satisfactory-dashboard-assets:tiles-20260805}
    volumes:
      - assets:/assets
    restart: "no"

  # Single long-running container: stdlib net/http serving the embedded SPA,
  # the seeded assets volume, and the GraphQL endpoint (/graphql HTTP + ws) on
  # one origin. SQLite lives on the app-data volume.
  app:
    # SD_VERSION pins a released image tag; unset tracks main. Image tags carry
    # no leading "v" (SD_VERSION=1.0.0 for release v1.0.0).
    image: ghcr.io/saffronjam/satisfactory-dashboard:${SD_VERSION:-latest}
    container_name: satisfactory-dashboard
    depends_on:
      seed-assets:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      # SD_MAX_SAMPLE_GAME_DURATION: Maximum game-time duration (in seconds) to retain historical data.
      - SD_MAX_SAMPLE_GAME_DURATION=${SD_MAX_SAMPLE_GAME_DURATION}
      - SD_DB_PATH=/data/satisfactory-dashboard.db
      # SD_DATA_DIR: where the first-run setup token is written. Read it with
      #   docker compose exec app cat /data/bootstrap.token
      - SD_DATA_DIR=/data
      - SD_ASSETS_DIR=/assets
      # SD_EXTERNAL_URL: lock the websocket Origin check to this URL (e.g.
      # https://dashboard.example.com). Empty = accept any origin (default).
      - SD_EXTERNAL_URL=${SD_EXTERNAL_URL:-}
    volumes:
      - app-data:/data
      - assets:/assets:ro
    restart: unless-stopped

volumes:
  app-data:
  assets:
