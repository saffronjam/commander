scalar DateTime

directive @auth on FIELD_DEFINITION

# ============================================================================
# Shared geometry / common types
# ============================================================================

type Location {
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
}

type BoundingBox {
  min: Location!
  max: Location!
}

type ItemStats {
  name: String!
  count: Float!
}

type Fuel {
  name: String!
  amount: Float!
}

# ============================================================================
# Power / circuits / stats
# ============================================================================

type CircuitConsumption {
  total: Float!
  max: Float!
}

type CircuitProduction {
  total: Float!
}

type CircuitCapacity {
  total: Float!
}

type CircuitBattery {
  percentage: Float!
  capacity: Float!
  differential: Float!
  untilFull: Float!
  untilEmpty: Float!
}

type Circuit {
  id: String!
  fuseTriggered: Boolean!
  consumption: CircuitConsumption!
  production: CircuitProduction!
  capacity: CircuitCapacity!
  battery: CircuitBattery!
}

type PowerInfo {
  circuitId: Int!
  circuitGroupId: Int!
  powerConsumed: Float!
  maxPowerConsumed: Float!
}

type PowerSource {
  count: Int!
  totalProduction: Float!
}

type PowerSourceEntry {
  type: PowerType!
  source: PowerSource!
}

type GeneratorStats {
  sources: [PowerSourceEntry!]!
}

type MachineEfficiency {
  machinesOperating: Int!
  machinesIdle: Int!
  machinesPaused: Int!
  machinesUnconfigured: Int!
  machinesUnknown: Int!
}

type FactoryStats {
  totalMachines: Int!
  efficiency: MachineEfficiency!
}

type ItemProdStats {
  name: String!
  count: Float!
  producedPerMinute: Float!
  maxProducePerMinute: Float!
  produceEfficiency: Float!
  consumedPerMinute: Float!
  maxConsumePerMinute: Float!
  consumeEfficiency: Float!
  cloudCount: Float!
  minable: Boolean!
}

type ProdStats {
  minableProducedPerMinute: Float!
  minableConsumedPerMinute: Float!
  itemsProducedPerMinute: Float!
  itemsConsumedPerMinute: Float!
  items: [ItemProdStats!]!
}

type SinkStats {
  totalPoints: Float!
  coupons: Int!
  nextCouponProgress: Float!
  pointsPerMinute: Float!
}

enum PowerType {
  BIOMASS
  COAL
  FUEL
  GEOTHERMAL
  NUCLEAR
  UNKNOWN
}

# ============================================================================
# Vehicles
# ============================================================================

enum DroneStatus {
  IDLE
  FLYING
  DOCKING
}

type Drone {
  name: String!
  speed: Float!
  status: DroneStatus!
  home: DroneStation!
  paired: DroneStation
  destination: DroneStation
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int!
}

type DroneStation {
  name: String!
  fuel: Fuel
  boundingBox: BoundingBox!
  incomingRate: Float!
  outgoingRate: Float!
  inputInventory: [ItemStats!]!
  outputInventory: [ItemStats!]!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

enum TrainType {
  FREIGHT
  LOCOMOTIVE
}

enum TrainStatus {
  SELF_DRIVING
  MANUAL_DRIVING
  PARKED
  DOCKING
  DERAILED
  UNKNOWN
}

type TrainVehicle {
  type: TrainType!
  capacity: Float!
  inventory: [ItemStats!]!
}

type TrainTimetableEntry {
  station: String!
}

type Train {
  id: String!
  name: String!
  speed: Float!
  status: TrainStatus!
  powerConsumption: Float!
  vehicles: [TrainVehicle!]!
  timetable: [TrainTimetableEntry!]!
  timetableIndex: Int!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

enum TrainStationPlatformType {
  FREIGHT
  FLUID_FREIGHT
}

enum TrainStationPlatformMode {
  IMPORT
  EXPORT
}

enum TrainStationPlatformStatus {
  IDLE
  DOCKING
}

type TrainStationPlatform {
  id: String!
  type: TrainStationPlatformType!
  mode: TrainStationPlatformMode!
  status: TrainStationPlatformStatus!
  boundingBox: BoundingBox!
  inventory: [ItemStats!]!
  transferRate: Float!
  inflowRate: Float!
  outflowRate: Float!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
}

type TrainStation {
  name: String!
  boundingBox: BoundingBox!
  platforms: [TrainStationPlatform!]!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

enum TruckStatus {
  SELF_DRIVING
  MANUAL_DRIVING
  PARKED
  UNKNOWN
}

type Truck {
  id: String!
  name: String!
  speed: Float!
  status: TruckStatus!
  fuel: Fuel
  inventory: [ItemStats!]!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

type TruckStation {
  name: String!
  boundingBox: BoundingBox!
  transferRate: Float!
  maxTransferRate: Float!
  inventory: [ItemStats!]!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

enum TractorStatus {
  SELF_DRIVING
  MANUAL_DRIVING
  PARKED
  UNKNOWN
}

type Tractor {
  id: String!
  name: String!
  speed: Float!
  status: TractorStatus!
  fuel: Fuel
  inventory: [ItemStats!]!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

enum ExplorerStatus {
  SELF_DRIVING
  MANUAL_DRIVING
  PARKED
  UNKNOWN
}

type Explorer {
  id: String!
  name: String!
  speed: Float!
  status: ExplorerStatus!
  fuel: Fuel
  inventory: [ItemStats!]!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

enum VehiclePathType {
  EXPLORER
  FACTORY_CART
  TRUCK
  TRACTOR
}

type VehiclePath {
  name: String!
  vehicleType: VehiclePathType!
  pathLength: Float!
  vertices: [Location!]!
}

# ============================================================================
# Infrastructure
# ============================================================================

enum MachineType {
  ASSEMBLER
  CONSTRUCTOR
  FOUNDRY
  MANUFACTURER
  REFINERY
  SMELTER
  BLENDER
  PACKAGER
  PARTICLE_ACCELERATOR
  MINER
  OIL_EXTRACTOR
  WATER_EXTRACTOR
  BIOMASS_BURNER
  COAL_GENERATOR
  FUEL_GENERATOR
  GEOTHERMAL_GENERATOR
  NUCLEAR_POWER_PLANT
}

enum MachineCategory {
  FACTORY
  EXTRACTOR
  GENERATOR
}

enum MachineStatus {
  OPERATING
  IDLE
  PAUSED
  UNCONFIGURED
  UNKNOWN
}

enum StorageType {
  BLUEPRINT_STORAGE_BOX
  DIMENSIONAL_DEPOT_UPLOADER
  INDUSTRIAL_STORAGE_CONTAINER
  PERSONAL_STORAGE_BOX
  STORAGE_CONTAINER
}

enum SplitterMergerType {
  CONVEYOR_MERGER
  CONVEYOR_SPLITTER
  PROGRAMMABLE_SPLITTER
  SMART_SPLITTER
}

enum TrainRailType {
  RAILWAY
}

type MachineProdStats {
  name: String!
  stored: Float!
  current: Float!
  max: Float!
  efficiency: Float!
}

type Machine {
  type: MachineType!
  status: MachineStatus!
  category: MachineCategory!
  productivity: Float!
  input: [MachineProdStats!]!
  output: [MachineProdStats!]!
  boundingBox: BoundingBox!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  circuitId: Int!
  circuitGroupId: Int
}

type Storage {
  id: String!
  type: StorageType!
  inventory: [ItemStats!]!
  boundingBox: BoundingBox!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
}

type Belt {
  id: String!
  name: String!
  location0: Location!
  location1: Location!
  connected0: Boolean!
  connected1: Boolean!
  splineData: [Location!]!
  length: Float!
  itemsPerMinute: Float!
}

type SplitterMerger {
  id: String!
  type: SplitterMergerType!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  boundingBox: BoundingBox!
}

type Pipe {
  id: String!
  name: String!
  location0: Location!
  location1: Location!
  connected0: Boolean!
  connected1: Boolean!
  splineData: [Location!]!
  length: Float!
  itemsPerMinute: Float!
}

type PipeJunction {
  id: String!
  name: String!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
}

type Cable {
  id: String!
  name: String!
  location0: Location!
  location1: Location!
  connected0: Boolean!
  connected1: Boolean!
  length: Float!
}

type TrainRail {
  id: String!
  type: TrainRailType!
  location0: Location!
  location1: Location!
  connected0: Boolean!
  connected1: Boolean!
  splineData: [Location!]!
  length: Float!
}

type Hypertube {
  id: String!
  location0: Location!
  location1: Location!
  splineData: [Location!]!
  boundingBox: BoundingBox!
}

type HypertubeEntrance {
  id: String!
  x: Float!
  y: Float!
  z: Float!
  rotation: Float!
  boundingBox: BoundingBox!
  powerInfo: PowerInfo!
}

# ============================================================================
